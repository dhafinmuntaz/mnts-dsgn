<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail | MNTS DSGN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-inner">
        <a href="index.html" class="logo" data-site-name>MNTS DSGN</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html#about">About</a>
          <a href="index.html#projects">Projects</a>
          <a href="index.html#insights">Insights</a>
          <a href="index.html#career">Career</a>
          <a href="index.html#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main style="padding-top: 120px;">
      <section class="container" style="padding-bottom: 80px;">
        <div class="project-detail-card" style="background: rgba(255,255,255,0.78); border: 1px solid rgba(17,17,17,0.08); border-radius: 20px; padding: 24px; box-shadow: 0 18px 45px rgba(17,17,17,0.08);">
          <img id="projectDetailImage" src="" alt="Project detail" style="width: 100%; height: 500px; object-fit: cover; border-radius: 18px;" />
          <div style="margin-top: 24px;">
            <div id="projectDetailLocation" class="project-location" style="margin-bottom: 10px;">Location</div>
            <h1 id="projectDetailTitle" style="font-size: clamp(2.2rem, 4vw, 3.5rem); letter-spacing: -0.05em; margin-bottom: 14px;">Project Title</h1>
            <p id="projectDetailDescription" style="font-size: 1.05rem; color: #5e5a57; line-height: 1.8; max-width: 760px;">Description</p>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/site.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      const projects = JSON.parse(localStorage.getItem('studioASAProjects') || '[]');
      const project = projects.find((item) => item.id === projectId) || projects[0];

      if (project) {
        const img = document.getElementById('projectDetailImage');
        const title = document.getElementById('projectDetailTitle');
        const location = document.getElementById('projectDetailLocation');
        const description = document.getElementById('projectDetailDescription');

        img.src = project.image || 'https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&q=80&w=1200';
        title.textContent = project.title;
        location.textContent = project.location;
        description.textContent = project.description;
      }
    </script>
  </body>
</html>
